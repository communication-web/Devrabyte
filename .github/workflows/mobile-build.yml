name: Mobile Build (APK + IPA)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]
      platform:
        description: 'Platform'
        required: true
        default: 'all'
        type: choice
        options: [all, android, ios]
  push:
    branches: [main]
    paths: ['mobile/**']

jobs:
  build:
    name: EAS Build — ${{ github.event.inputs.platform || 'all' }} (${{ github.event.inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'all' }}"
          eas build \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_BRAND_NAME: ${{ vars.EXPO_PUBLIC_BRAND_NAME || 'House of Jade' }}
          EXPO_PUBLIC_POWERED_BY: ${{ vars.EXPO_PUBLIC_POWERED_BY || 'Devrabyte' }}

      - name: Build submitted
        run: |
          echo "✅ Build queued on EAS. Check status at:"
          echo "   https://expo.dev/accounts/[YOUR_ACCOUNT]/projects/house-of-jade/builds"
          echo ""
          echo "Download links will appear there when the build completes (~15 min)."
